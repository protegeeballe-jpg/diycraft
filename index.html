<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIYCRAFT: Roleplay & Build</title>
    <!-- Link to separate CSS file -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- 3D Game Viewport -->
    <div id="game-container"></div>

    <!-- HUD Information Layer -->
    <div id="ui-layer">
        <div class="hud-panel" style="align-self: flex-start;">
            <div>
                <h1>DIYCRAFT</h1>
                <p>Peaceful Creative Sanctuary 🛡️</p>
            </div>
            <!-- Small button to hide/show UI elements -->
            <button onclick="toggleHUD()">Hide UI</button>
        </div>

        <div class="hud-panel" style="align-self: center;">
            <p>Press <b>'E'</b> to open Pouches | Click screen to build</p>
        </div>
    </div>

    <!-- Inventory Pouch Modal (Dual 60-Slot Architecture) - Hidden by default -->
    <div id="inventory-modal" class="inventory-container hidden">
        <div class="inventory-header">
            <h2>Pouch 1: Raw Materials & Tools (60 Slots)</h2>
            <button onclick="toggleInventory()">Close</button>
        </div>
        <div id="raw-slots" class="slot-grid"></div>
        
        <div class="inventory-header">
            <h2>Pouch 2: Crafted Items & Decor (60 Slots)</h2>
        </div>
        <div id="crafted-slots" class="slot-grid"></div>
        <p style="text-align: center; color: #81C784; font-size: 12px;">🔒 Guardrails Active: Zero weapons or harmful items allowed.</p>
    </div>

    <!-- Three.js 3D Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Custom Game Logic -->
    <script src="script.js"></script>
</body>
</html>
