<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIYCRAFT: Roleplay & Build</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            color: #fff;
            user-select: none;
        }
        #game-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        /* UI Overlay */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
        }
        .hud-panel {
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #4CAF50;
            border-radius: 8px;
            padding: 10px 15px;
            pointer-events: auto;
            backdrop-filter: blur(4px);
        }
        h1 { margin: 0 0 5px 0; font-size: 20px; color: #81C784; }
        p { margin: 0; font-size: 14px; color: #ddd; }
        
        /* Inventory Pouches style */
        .inventory-container {
            display: none; /* Toggled via keypress */
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(20, 20, 20, 0.9);
            border: 3px solid #81C784;
            border-radius: 12px;
            padding: 20px;
            width: 600px;
            max-height: 80vh;
            overflow-y: auto;
            pointer-events: auto;
        }
        .slot-grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 6px;
            margin-top: 10px;
        }
        .slot {
            width: 45px;
            height: 45px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid #555;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #aaa;
        }
    </style>
</head>
<body>

    <!-- 3D Game Viewport -->
    <div id="game-container"></div>

    <!-- HUD Information -->
    <div id="ui-layer">
        <div class="hud-panel" style="align-self: flex-start;">
            <h1>DIYCRAFT: Roleplay & Build</h1>
            <p>Mode: Peaceful Creative | Status: Safe Sanctuary 🛡️</p>
        </div>
        <div class="hud-panel" style="align-self: center;">
            <p>Press <b>'E'</b> to open Pouches | Click screen to build</p>
        </div>
    </div>

    <!-- Inventory Pouch Modal (Dual 60-Slot Architecture) -->
    <div id="inventory-modal" class="inventory-container">
        <h2>Pouch 1: Raw Materials & Tools (60 Slots)</h2>
        <div id="raw-slots" class="slot-grid"></div>
        
        <h2 style="margin-top: 20px;">Pouch 2: Crafted Items & Decor (60 Slots)</h2>
        <div id="crafted-slots" class="slot-grid"></div>
        <p style="margin-top: 15px; text-align: center; color: #81C784;">🔒 Guardrails Active: No weapons or harmful items allowed.</p>
    </div>

    <!-- Include Three.js for 3D graphics rendering -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Include Custom Game Logic -->
    <script src="script.js"></script>
</body>
</html>
