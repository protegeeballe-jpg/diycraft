<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self'; font-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#f3ecdc">
<title>DIYCraft — Three.js starter-world migration preview</title>
<style>
:root{color-scheme:light;--ink:#43564a;--muted:#718075;--paper:#f6f0e3}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--paper);font-family:Georgia,"Times New Roman",serif;color:var(--ink)}
#three-world{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:none;outline:none}
.topbar{position:absolute;z-index:2;top:14px;left:16px;right:16px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;pointer-events:none}
.brand,.note{background:rgba(255,252,244,.88);border:1px solid rgba(111,130,111,.22);box-shadow:0 5px 24px rgba(71,83,65,.08);backdrop-filter:blur(8px);border-radius:16px;padding:10px 14px}
.brand strong{display:block;font-size:16px;letter-spacing:.02em;font-weight:700}
.brand span,.note{font:12px/1.45 Arial,sans-serif;color:var(--muted)}
.note{max-width:290px;text-align:right}
#counts{position:absolute;left:16px;bottom:16px;background:rgba(255,252,244,.82);border:1px solid rgba(111,130,111,.2);border-radius:14px;padding:9px 12px;font:11px/1.45 Arial,sans-serif;color:var(--muted);box-shadow:0 4px 18px rgba(71,83,65,.08);pointer-events:none}
.hint{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);background:rgba(255,252,244,.82);border:1px solid rgba(111,130,111,.2);border-radius:999px;padding:8px 14px;font:12px Arial,sans-serif;color:var(--muted);white-space:nowrap;box-shadow:0 4px 18px rgba(71,83,65,.08);pointer-events:none}
#error{display:none;position:absolute;inset:20% 10%;background:#fff7f2;border:1px solid #d99c87;border-radius:16px;padding:18px;color:#713f32;font:14px/1.5 Arial,sans-serif;white-space:pre-wrap}
@media(max-width:620px){.topbar{top:9px;left:9px;right:9px}.brand{padding:8px 10px}.brand strong{font-size:14px}.brand span{font-size:10px}.note{max-width:170px;padding:8px 10px;font-size:10px}.hint{bottom:8px;font-size:10px}#counts{left:9px;bottom:42px;font-size:10px}}
</style>
</head>
<body>
<canvas id="three-world" aria-label="Three-dimensional rendering of the actual DIYCraft starter world"></canvas>
<div class="topbar">
  <div class="brand"><strong>DIYCraft · Real World 3D Preview</strong><span>Original starter world · watercolor + colored pencil</span></div>
  <div class="note">Stage 1 migration preview<br>Read-only world data · Drag to look · Scroll to zoom</div>
</div>
<div id="counts">Reading the original starter world…</div>
<div class="hint">This preview does not save or change your game</div>
<div id="error"></div>
<script src="./js/three.js"></script><script src="./js/three-performance-profile.js"></script>
<script src="./js/three-world-adapter.js"></script>
<script src="./js/three-painterly-materials.js"></script>
<script src="./three-world-preview.js"></script>
</body>
</html>
