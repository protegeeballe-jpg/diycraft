name: DIYCraft Three.js painterly prototype

on:
  push:
    branches:
      - three-painterly-prototype
    paths:
      - three-painterly-preview.html
      - three-painterly-preview.js
      - js/three.js
      - tests/three-painterly-preview.cjs
      - .github/workflows/three-painterly-preview.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Chromium preview runner
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Render and validate the local Three.js painterly scene
        run: node tests/three-painterly-preview.cjs
      - name: Upload experimental 3D screenshot
        uses: actions/upload-artifact@v4
        with:
          name: diycraft-three-painterly-preview
          path: preview-three/
          if-no-files-found: error
          retention-days: 7
