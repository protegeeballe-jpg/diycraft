name: DIYCraft Three.js migration guard

on:
  push:
    branches:
      - three-js-migration
    paths:
      - js/three-world-adapter.js
      - js/three-world-edit-sandbox.js
      - js/three-world-raycast.js
      - js/three-door-motion.js
      - js/three-door-model.js
      - js/three-performance-profile.js
      - js/three-plant-geometry.js
      - js/three-player-physics.js
      - js/three-player-camera.js
      - js/three-neighbor-model.js
      - js/three-neighbor-coloring.js
      - js/three-world-protection.js
      - js/three-world-time.js
      - tests/three-door-motion.test.cjs
      - tests/three-door-model.test.cjs
      - tests/three-performance-profile.test.cjs
      - tests/three-player-physics.test.cjs
      - tests/three-player-camera.test.cjs
      - tests/three-neighbor-model.test.cjs
      - tests/three-neighbor-coloring.test.cjs
      - tests/three-neighbor-selection.test.cjs
      - tests/three-world-protection.test.cjs
      - tests/three-world-time.test.cjs
      - tests/three-world-adapter.test.cjs
      - js/three-world-protection.js
      - tests/three-world-edit-sandbox.test.cjs
      - tests/three-world-raycast.test.cjs
      - tests/three-world-canvas-parity.test.cjs
      - THREE_JS_MIGRATION.md
      - js/three.js
      - js/three-animal-geometry.js
      - js/three-painterly-materials.js
      - js/three-player-model.js
      - three-world-preview.html
      - three-world-preview.js
      - three-world-edit-preview.html
      - three-world-edit-preview.js
      - index.html
      - offline/index.html
      - tests/three-security-guard.cjs
      - .github/workflows/three-migration-guard.yml
  pull_request:
    paths:
      - js/three-world-adapter.js
      - tests/three-world-adapter.test.cjs
      - THREE_JS_MIGRATION.md
      - js/three.js
      - js/three-animal-geometry.js
      - js/three-painterly-materials.js
      - js/three-player-model.js
      - three-world-preview.html
      - three-world-preview.js
      - three-world-edit-preview.html
      - three-world-edit-preview.js
      - index.html
      - offline/index.html
      - tests/three-security-guard.cjs
      - .github/workflows/three-migration-guard.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  data-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Fetch untouched production main for save compatibility checks
        run: git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
      - name: Run Three.js migration security guard
        run: node tests/three-security-guard.cjs
      - name: Run read-only world adapter regression tests
        run: node tests/three-world-adapter.test.cjs
      - name: Run original DIYCraft backup schema compatibility tests
        run: node tests/three-world-save-format.test.cjs
      - name: Run isolated editing sandbox regression tests
        run: node tests/three-world-edit-sandbox.test.cjs
      - name: Run raycast selection resolver tests
        run: node tests/three-world-raycast.test.cjs
      - name: Run door animation timing and reversal tests
        run: node tests/three-door-motion.test.cjs
      - name: Run production-aligned door geometry model tests
        run: node tests/three-door-model.test.cjs
      - name: Run mobile performance profile tests
        run: node tests/three-performance-profile.test.cjs
      - name: Run deterministic player physics parity tests
        run: node tests/three-player-physics.test.cjs
      - name: Run first-person and third-person camera parity tests
        run: node tests/three-player-camera.test.cjs
      - name: Run single-draw-call player appearance model tests
        run: node tests/three-player-model.test.cjs
      - name: Run painterly neighbor character model tests
        run: node tests/three-neighbor-model.test.cjs
      - name: Run cooperative neighbor coloring tests
        run: node tests/three-neighbor-coloring.test.cjs
      - name: Run original world-time palette tests
        run: node tests/three-world-time.test.cjs
      - name: Run NPC tap-selection parity tests
        run: node tests/three-neighbor-selection.test.cjs
      - name: Run neighbor and animal protection parity tests
        run: node tests/three-world-protection.test.cjs
      - name: Compare Canvas 2D and Three.js placement behavior
        run: node tests/three-world-canvas-parity.test.cjs
