name: DIYCraft painterly preview capture

on:
  push:
    branches:
      - safe-mobile-storage
    paths:
      - tests/painterly-preview.cjs
      - .github/workflows/painterly-preview.yml
      - index.html
      - diycraft.js
      - sw.js
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Chromium preview runner
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Render the real DIYCraft development build
        run: node tests/painterly-preview.cjs
      - name: Upload visual preview
        uses: actions/upload-artifact@v4
        with:
          name: diycraft-painterly-preview
          path: preview/
          if-no-files-found: error
          retention-days: 7
