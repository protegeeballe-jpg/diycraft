name: Validate DIYCraft

on:
  push:
    paths:
      - index.html
      - offline/index.html
      - diycraft.js
      - sw.js
      - three-world-live.js
      - js/three-*.js
      - tests/three-world-storage.test.cjs
      - tests/three-world-starter.test.cjs
      - tests/three-world-edit-sandbox.test.cjs
      - .github/workflows/validate-diycraft.yml
  pull_request:
    paths:
      - index.html
      - offline/index.html
      - diycraft.js
      - sw.js
      - three-world-live.js
      - js/three-*.js
      - tests/three-world-storage.test.cjs
      - tests/three-world-starter.test.cjs
      - tests/three-world-edit-sandbox.test.cjs
      - .github/workflows/validate-diycraft.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production:
    name: Validate the live Three.js and offline entry points
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify production and offline entries, strict CSP and local modules
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const path=require('node:path');
          const main=fs.readFileSync('index.html','utf8');
          const offline=fs.readFileSync('offline/index.html','utf8');
          const normalized=offline
            .replace('href="../manifest.json"','href="./manifest.json"')
            .replace('href="../diycraft-icon.svg"','href="./diycraft-icon.svg"')
            .replace('href="../diycraft-icon-192.png"','href="./diycraft-icon-192.png"')
            .replaceAll('src="../js/','src="./js/')
            .replace('src="../three-world-live.js"','src="./three-world-live.js"');
          if(main!==normalized)throw new Error('Production and offline Three.js pages must remain identical except for expected relative asset paths.');
          const launch=fs.readFileSync('linkedin.html','utf8');
          if(!launch.includes('<title>DIYCraft</title>')||
             !launch.includes('class="play-button" href="./index.html"')||
             !launch.includes('https://github.com/protegeeballe-jpg/diycraft'))
           throw new Error('DIYCraft launch page links are missing.');
          for(const [name,html] of [['main',main],['offline',offline]]){
           if(!html.includes('<canvas id="three-world"')||html.includes('id="game"'))
            throw new Error(name+' entry page must use the Three.js world canvas, not the Canvas 2D world.');
           if(!html.includes("script-src 'self'")||html.includes("script-src 'unsafe-inline'")||
              !html.includes("connect-src 'self'")||!html.includes("worker-src 'self'"))
            throw new Error(name+' entry page has an unsafe or incomplete content security policy.');
           const tags=[...html.matchAll(/<script\b([^>]*)>/gi)];
           if(tags.length!==20)throw new Error(name+' entry page must load exactly 20 reviewed local engine modules; found '+tags.length);
           for(const tag of tags){
            const src=(tag[1].match(/\bsrc=["']([^"']+)["']/i)||[])[1];
            if(!src||/^(?:[a-z][a-z0-9+.-]*:)?\/\//i.test(src)||/^(?:javascript|data):/i.test(src))
             throw new Error(name+' entry page contains a non-local or inline script.');
            const target=path.join(name==='main'?'.':'offline',src);
            if(!fs.existsSync(target))throw new Error(name+' entry is missing local script '+src);
           }
          }
          for(const id of ['animal-place','animal-species','save-now','backup-download','backup-restore','play-mode','camera-mode','jump','flight','activity-apply','set-home-bed','go-home','inventory-open','character-open','art-open','gallery-open','solid-design-open','door-design-open','tile-design-open'])
           if(!main.includes('id="'+id+'"'))throw new Error('Missing live game UI control: '+id);
          const runtime=fs.readFileSync('three-world-live.js','utf8');
          if(!runtime.includes('storage.load(deviceStorage,adapter,starterWorld.create())')||
             !runtime.includes('storage.save(deviceStorage,adapter,snapshot')||
             !runtime.includes('storage.saveSync(deviceStorage,adapter,world')||
             runtime.includes('preview-three/starter-world.json')||/\bfetch\s*\(/.test(runtime))
           throw new Error('The live Three.js runtime must load and save real device worlds with no preview-fixture dependency.');
          if(runtime.includes('localStorage.setItem('))throw new Error('All renderer storage writes must use the reviewed storage adapter.');
          const worker=fs.readFileSync('sw.js','utf8');
          if(!/const CACHE_NAME = 'diycraft-shell-v\d+'/.test(worker)||
             !worker.includes("request.destination === 'script'")||
             !worker.includes("new URL('three-world-live.js', root).href")||
             !worker.includes("new URL('js/three-world-starter.js', root).href"))
           throw new Error('The service worker must version and cache all live Three.js modules.');
          NODE
      - name: Syntax-check all live production scripts and the offline worker
        run: |
          node --check sw.js
          node --check three-world-live.js
          for file in $(grep -oE 'src="[^"]+"' index.html | cut -d '"' -f2); do node --check "$file"; done
      - name: Run original version-1 world storage compatibility tests
        run: node tests/three-world-storage.test.cjs
      - name: Verify canonical starter-world parity
        run: node tests/three-world-starter.test.cjs
      - name: Run Three.js editing, protection and save-safety tests
        run: node tests/three-world-edit-sandbox.test.cjs
