name: Validate DIYCraft

on:
  push:
    paths:
      - index.html
      - offline/index.html
      - sw.js
      - offline/README.md
      - .github/workflows/validate-diycraft.yml
  pull_request:
    paths:
      - index.html
      - offline/index.html
      - sw.js
      - offline/README.md
      - .github/workflows/validate-diycraft.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  javascript:
    name: Check both DIYCraft entry points
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify both published pages stay in sync and syntax-check the game
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const main = fs.readFileSync('index.html', 'utf8');
          const offline = fs.readFileSync('offline/index.html', 'utf8');

          if (main !== offline) {
            throw new Error('Main and offline DIYCraft entry points must stay identical.');
          }

          const html = main;
          const openTag = '<script';
          const closeTag = '</script>';
          const scriptCount = html.split(openTag).length - 1;
          const open = html.indexOf(openTag);
          const tagEnd = html.indexOf('>', open);
          const close = html.lastIndexOf(closeTag);

          if (scriptCount !== 1 || open < 0 || tagEnd < 0 || close <= tagEnd) {
            throw new Error('Expected exactly one complete inline game script.');
          }

          const source = html.slice(tagEnd + 1, close);
          const required = [
            'function getTimePalette',
            'const NEIGHBOR_ROUTES',
            'function neighborOnRoute',
            'const HOLD_TO_REMOVE_MS=600',
            'function toggleDoor(door)',
            'function drawVoxelDoor(queue,cam,w,h,door)',
            'function jump()',
            'function surfaceHeightAt(x,z)',
            'const MAX_DIG_DEPTH=8,GROUND_DIG_LIMIT=12000',
            'function traceWorldRay(cam,dir,maxDistance,step)',
            'function isProtectedDigCell(x,z)',
            'function digAtScreen(',
            'function pushGroundSurface(queue,cam,w,h,color)',
            'function skyDirection(azimuth,altitude)',
            'function projectSkyPoint(cam,direction,w,h,distance=700)',
            'function drawSkyDecorations(cam,w,h,palette)',
            'function pushExcavationTerrain(queue,cam,w,h)',
            'function setToolMode(mode,announce=true)',
            'function fillAtScreen(px=canvas.clientWidth/2,py=canvas.clientHeight/2)',
            'function waterAtScreen(px=canvas.clientWidth/2,py=canvas.clientHeight/2)',
            'function fishAtScreen(px=canvas.clientWidth/2,py=canvas.clientHeight/2)',
            'function pushWaterSurfaces(queue,cam,w,h)',
            'function drawFishOverlays(cam,w,h)',
            'function consumeItem(id,target=\'materials\',amount=1)',
            'const PLAYER_JUMP_SPEED=6.4,PLAYER_GRAVITY=14.5',
            'function makeTileTexturePatterns()',
            'function pushTileSlab',
            'function paintTileTexture',
            'function openTileDesigner()',
            'btn.addEventListener(\'click\',()=>{selected=\'tile\';renderHotbar();openTileDesigner();})',
            'const TILE_THICKNESS=.13,TILE_BASE_OFFSET=.02',
            'b.y+TILE_BASE_OFFSET',
            '1,TILE_THICKNESS,1',
            'floor<=p.y+.18',
            'const TILE_DESIGNS=[',
            'function playerCollisionAt(x,z,y)',
            'function buildNeighborObstacleSet()',
            'function findNeighborPath(start,end)',
            'const NEIGHBOR_SLEEP_SPOTS=',
            "currentNeighbors(tick,palette.mode==='night')",
            "if(b.type==='door'&&b.open)continue",
            'const PLAYER_RADIUS=.23,PLAYER_BODY_HEIGHT=1.72,PLAYER_STEP_HEIGHT=.18',
            'navigator.serviceWorker.register',
            "id:'tile'",
            "id:'door'"
          ];
          for (const marker of required) {
            if (!source.includes(marker)) {
              throw new Error('Missing expected DIYCraft feature: ' + marker);
            }
          }
          if (!html.includes('id="customBlockShade"') || !html.includes('id="doorShade"') || !html.includes('id="jumpBtn"') || !html.includes('id="tileShade"') || !html.includes('id="tileDesignBtn"') || !html.includes('id="digBtn"') || !html.includes('id="digModeBtn"') || !html.includes('id="fillBtn"') || !html.includes('id="waterBtn"') || !html.includes('id="fishBtn"') || !html.includes('id="fillModeBtn"') || !html.includes('id="waterModeBtn"') || !html.includes('id="fishModeBtn"')) {
            throw new Error('A block, door, jump, or tile designer control is missing.');
          }
          const tileList = source.match(/const TILE_DESIGNS=\[([\s\S]*?)\];/);
          const tileCount = tileList ? (tileList[1].match(/\bid:/g) || []).length : 0;
          if (tileCount !== 20) throw new Error('Expected exactly 20 tile designs; found ' + tileCount);
          if (!html.includes('id="offlineReadyNote"')) throw new Error('Persistent offline-ready status is missing.');
          if (!html.includes("connect-src 'self'") || !html.includes("worker-src 'self'")) {
            throw new Error('The same-origin offline worker is not allowed by the content security policy.');
          }
          const worker = fs.readFileSync('sw.js', 'utf8');
          if (!worker.includes("const CACHE_NAME = 'diycraft-shell-v6'")) throw new Error('Expected the refreshed DIYCraft offline cache version.');
          for (const marker of ['self.addEventListener(\'install\'', 'cache.addAll(pages)', 'request.mode !== \'navigate\'', 'ignoreSearch: true']) {
            if (!worker.includes(marker)) throw new Error('Missing offline cache behavior: ' + marker);
          }

          fs.writeFileSync('/tmp/diycraft-inline.js', source);
          NODE
          node --check /tmp/diycraft-inline.js

      - name: Syntax-check the offline service worker
        run: node --check sw.js
