name: Validate DIYCraft

on:
  push:
    paths:
      - index.html
      - offline/index.html
      - .github/workflows/validate-diycraft.yml
  pull_request:
    paths:
      - index.html
      - offline/index.html
      - .github/workflows/validate-diycraft.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  javascript:
    name: Check both DIYCraft entry points
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify both published pages stay in sync and syntax-check the game
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const main = fs.readFileSync('index.html', 'utf8');
          const offline = fs.readFileSync('offline/index.html', 'utf8');

          if (main !== offline) {
            throw new Error('Main and offline DIYCraft entry points must stay identical.');
          }

          const html = main;
          const openTag = '<script';
          const closeTag = '</script>';
          const scriptCount = html.split(openTag).length - 1;
          const open = html.indexOf(openTag);
          const tagEnd = html.indexOf('>', open);
          const close = html.lastIndexOf(closeTag);

          if (scriptCount !== 1 || open < 0 || tagEnd < 0 || close <= tagEnd) {
            throw new Error('Expected exactly one complete inline game script.');
          }

          const source = html.slice(tagEnd + 1, close);
          const required = [
            'function getTimePalette',
            'const NEIGHBOR_ROUTES',
            'function neighborOnRoute',
            'const HOLD_TO_REMOVE_MS=600',
            'function toggleDoor(door)',
            'function drawVoxelDoor(queue,cam,w,h,door)',
            "id:'door'"
          ];
          for (const marker of required) {
            if (!source.includes(marker)) {
              throw new Error('Missing expected DIYCraft feature: ' + marker);
            }
          }
          if (!html.includes('id="customBlockShade"') || !html.includes('id="doorShade"')) {
            throw new Error('A block or door designer panel is missing.');
          }

          fs.writeFileSync('/tmp/diycraft-inline.js', source);
          NODE
          node --check /tmp/diycraft-inline.js
