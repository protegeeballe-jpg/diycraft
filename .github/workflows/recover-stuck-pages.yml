name: Inspect GitHub Pages deployment health

on:
  push:
    paths:
      - .github/workflows/recover-stuck-pages.yml
  workflow_dispatch:

permissions:
  pages: read
  deployments: read
  contents: read

jobs:
  inspect:
    name: Inspect the stale Pages deployment records
    runs-on: ubuntu-latest
    steps:
      - name: Compare Pages state with repository deployment records
        uses: actions/github-script@v7
        with:
          script: |
            const deploymentRef = '1d94e396c146f607c56be2a47b4be875f92595ab';
            const params = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pages_deployment_id: deploymentRef
            };

            try {
              const pages = await github.request(
                'GET /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}',
                params
              );
              core.info(`Pages API status for ${deploymentRef}: ${pages.data.status || 'unknown'}`);
            } catch (error) {
              if (error.status !== 404) throw error;
              core.warning(`No Pages deployment status record exists for ${deploymentRef}; continuing with standard deployment records.`);
            }

            const listed = await github.request(
              'GET /repos/{owner}/{repo}/deployments',
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: deploymentRef,
                per_page: 100
              }
            );

            core.info(`Standard deployment records matching this SHA: ${listed.data.length}`);
            for (const deployment of listed.data) {
              const statusResult = await github.request(
                'GET /repos/{owner}/{repo}/deployments/{deployment_id}/statuses',
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  deployment_id: deployment.id,
                  per_page: 20
                }
              );
              const statuses = statusResult.data || [];
              const latest = statuses[0] || null;
              core.info(JSON.stringify({
                id: deployment.id,
                sha: deployment.sha,
                environment: deployment.environment,
                task: deployment.task,
                created_at: deployment.created_at,
                latest_status: latest ? {
                  state: latest.state,
                  description: latest.description,
                  created_at: latest.created_at
                } : null
              }));
            }
