name: Recover stuck GitHub Pages deployment

on:
  push:
    paths:
      - .github/workflows/recover-stuck-pages.yml
  workflow_dispatch:

permissions:
  pages: write
  contents: read

jobs:
  recover:
    name: Cancel the stale Pages deployment
    runs-on: ubuntu-latest
    steps:
      - name: Check and cancel the deployment blocking newer builds
        uses: actions/github-script@v7
        with:
          script: |
            const deploymentId = '1d94e396c146f607c56be2a47b4be875f92595ab';
            const params = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pages_deployment_id: deploymentId
            };

            const current = await github.request(
              'GET /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}',
              params
            );

            const status = String(current.data.status || 'unknown').toLowerCase();
            core.info(`Pages deployment ${deploymentId} currently reports: ${status}`);

            if (status === 'succeed' || status === 'success') {
              core.notice('The blocking Pages deployment is already complete; nothing needs cancelling.');
              return;
            }

            const cancelled = await github.request(
              'POST /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}/cancel',
              params
            );

            core.notice(`GitHub accepted the cancellation request (HTTP ${cancelled.status}).`);
