name: Recover stuck GitHub Pages deployment

on:
  push:
    paths:
      - .github/workflows/recover-stuck-pages.yml
  workflow_dispatch:

permissions:
  pages: write
  contents: read

jobs:
  recover:
    name: Cancel the stale Pages deployment
    runs-on: ubuntu-latest
    steps:
      - name: Send an explicit cancellation for the stale deployment
        uses: actions/github-script@v7
        with:
          script: |
            const deploymentId = '1d94e396c146f607c56be2a47b4be875f92595ab';
            const params = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pages_deployment_id: deploymentId
            };

            const current = await github.request(
              'GET /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}',
              params
            );
            core.info(`Pages API status for ${deploymentId}: ${current.data.status || 'unknown'}`);
            core.info('The Pages deploy action still reports this SHA as an in-progress blocker; sending the explicit cancellation request.');

            const cancelled = await github.request(
              'POST /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}/cancel',
              params
            );
            core.notice(`GitHub accepted the cancellation request (HTTP ${cancelled.status}).`);
