name: DIYCraft live Three.js browser test

on:
  push:
    branches:
      - main
    paths:
      - index.html
      - offline/index.html
      - sw.js
      - three-world-live.js
      - js/three-*.js
      - tests/three-live-browser.cjs
      - tests/three-mobile-e2e.cjs
      - .github/workflows/browser-smoke.yml
  pull_request:
    paths:
      - index.html
      - offline/index.html
      - sw.js
      - three-world-live.js
      - js/three-*.js
      - tests/three-live-browser.cjs
      - tests/three-mobile-e2e.cjs
      - .github/workflows/browser-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Chromium test runner
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Test live Three.js renderer, real device saves and offline launch
        run: node tests/three-live-browser.cjs
      - name: Test mobile UI, touch controls, save integrity and frame pacing
        run: node tests/three-mobile-e2e.cjs
      - name: Upload live Three.js screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diycraft-live-three-world
          path: |
            three-live-main.png
            three-animal-bird.png
            three-animal-sheep.png
            three-flower-closeup.png
          if-no-files-found: ignore
          retention-days: 7
