<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>DIYCraft — Three.js editing sandbox</title>
<style>
:root{color-scheme:light;--paper:#f6f0e3;--ink:#43564a;--muted:#718075}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--paper);font-family:Arial,sans-serif;color:var(--ink)}
#three-world{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.panel{position:absolute;z-index:2;left:14px;top:14px;max-width:min(440px,calc(100vw - 28px));padding:12px 14px;background:rgba(255,252,244,.94);border:1px solid #c9d2bd;border-radius:14px;box-shadow:0 5px 22px #43564a18}
h1{font:700 15px Georgia,serif;margin:0 0 5px}.sub{font-size:11px;color:var(--muted);line-height:1.4}
.toolbar{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px;align-items:center}
button,select,input{font:12px Arial,sans-serif;color:var(--ink);background:#fffdf7;border:1px solid #bdc9b5;border-radius:8px;padding:7px 9px}
button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}
#color{width:35px;height:32px;padding:2px}#status{font:11px/1.45 Arial,sans-serif;color:var(--muted);margin-top:8px;max-width:390px}
#safety{position:absolute;right:14px;top:14px;max-width:230px;padding:10px 12px;background:#fffdf0df;border:1px solid #d6d0b7;border-radius:12px;font:11px/1.45 Arial,sans-serif;color:#65715e;text-align:right}
@media(max-width:600px){.panel{left:8px;top:8px}.toolbar{gap:5px}button,select{padding:6px 7px}#safety{right:8px;top:auto;bottom:8px;max-width:190px}}
</style></head>
<body>
<canvas id="three-world" aria-label="Interactive Three.js editing sandbox"></canvas>
<section class="panel">
<h1>DIYCraft · Three.js Editing Sandbox</h1>
<div class="sub">Experimental copy of the real starter world · watercolor + colored pencil</div>
<div class="toolbar">
<select id="bucket-item" aria-label="Choose a recovered Material Bucket item"><option value="">Bucket: none selected</option></select>
<select id="door-style" aria-label="Door style"><option value="classic">Classic door</option><option value="window">Window door</option><option value="garden">Garden door</option></select>
<select id="block-type" aria-label="Block type"><option value="water">Water</option><option value="grass">Grass</option><option value="dirt">Dirt</option><option value="stone">Stone</option><option value="wood">Wood</option><option value="leaves">Leaves</option><option value="brick">Brick</option><option value="glass">Glass</option><option value="sand">Sand</option><option value="snow">Snow</option><option value="flower">Flower</option><option value="tall_grass">Tall grass</option><option value="custom">Custom</option><option value="door">Door</option><option value="tile">Tile</option></select>
<input id="color" type="color" value="#70b85a" aria-label="Custom block color">
<button id="add">Place on face</button><button id="remove" disabled>Remove</button>
<button id="door" disabled>Open / close door</button>
<select id="pattern" aria-label="Tile pattern"><option value="grid">Grid</option><option value="brick">Brick</option><option value="checker">Checker</option><option value="diagonal">Diagonal</option><option value="diamond">Diamond</option><option value="hexagon">Hexagon</option><option value="herringbone">Herringbone</option><option value="basket">Basket Weave</option><option value="mosaic">Mosaic</option><option value="terrazzo">Terrazzo</option><option value="waves">Waves</option><option value="dots">Dots</option><option value="floral">Floral</option><option value="stars">Stars</option><option value="sunburst">Sunburst</option><option value="scallop">Scallop</option><option value="parquet">Parquet</option><option value="pebble">Pebble</option><option value="cross">Cross</option><option value="spiral">Spiral</option></select>
<button id="apply-pattern" disabled>Apply tile pattern</button>
<input id="water-x" type="number" value="14" step="1" aria-label="Water pool X coordinate" style="width:62px"><input id="water-z" type="number" value="-5" step="1" aria-label="Water pool Z coordinate" style="width:62px">
<button id="water-add">Add water</button><button id="water-collect">Collect water</button><button id="fish-add">Add fish</button><button id="fill-hole">Fill hole</button><button id="dig-ground">Dig ground</button>
</div>
<div id="status">Loading the isolated starter-world copy…</div>
</section>
<div id="safety">Sandbox only · No save, localStorage, or live-game changes<br>Drag to orbit · Scroll to zoom · Click to select</div>
<script src="./js/three.js"></script><script src="./js/three-performance-profile.js"></script><script src="./js/three-world-adapter.js"></script><script src="./js/three-door-model.js"></script>
<script src="./js/three-painterly-materials.js"></script><script src="./js/three-plant-geometry.js"></script><script src="./js/three-animal-geometry.js"></script><script src="./js/three-world-edit-sandbox.js"></script>
<script src="./js/three-world-raycast.js"></script><script src="./js/three-door-motion.js"></script><script src="./three-world-edit-preview.js"></script>
</body></html>
