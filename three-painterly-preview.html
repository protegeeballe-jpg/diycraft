<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self'; font-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#f3ecdc">
<title>DIYCraft — Three.js Painterly Preview</title>
<style>
:root{color-scheme:light;--ink:#43564a;--muted:#718075;--paper:#f6f0e3;--panel:#fffcf4}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--paper);font-family:Georgia,"Times New Roman",serif;color:var(--ink)}
body{position:relative}
#three-world{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:none;outline:none}
.topbar{position:absolute;z-index:2;top:16px;left:18px;right:18px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;pointer-events:none}
.brand,.note{background:rgba(255,252,244,.86);border:1px solid rgba(111,130,111,.22);box-shadow:0 5px 24px rgba(71,83,65,.08);backdrop-filter:blur(8px);border-radius:16px;padding:10px 14px}
.brand strong{display:block;font-size:16px;letter-spacing:.02em;font-weight:700}
.brand span,.note{font:12px/1.45 Arial,sans-serif;color:var(--muted)}
.note{max-width:260px;text-align:right}
.hint{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);background:rgba(255,252,244,.82);border:1px solid rgba(111,130,111,.2);border-radius:999px;padding:8px 14px;font:12px Arial,sans-serif;color:var(--muted);white-space:nowrap;box-shadow:0 4px 18px rgba(71,83,65,.08);pointer-events:none}
@media(max-width:620px){.topbar{top:10px;left:10px;right:10px}.brand{padding:8px 10px}.brand strong{font-size:14px}.brand span{font-size:11px}.note{max-width:160px;padding:8px 10px;font-size:10px}.hint{bottom:10px;font-size:10px}}
</style>
</head>
<body>
<canvas id="three-world" aria-label="Experimental Three.js three-dimensional watercolor and colored-pencil DIYCraft world"></canvas>
<div class="topbar">
  <div class="brand"><strong>DIYCraft · Painterly 3D</strong><span>Watercolor washes + colored-pencil grain</span></div>
  <div class="note">Experimental Three.js art preview<br>Drag to look around · Scroll to zoom</div>
</div>
<div class="hint">A separate rendering experiment — the main game is unchanged</div>
<script src="./js/three.js"></script>
<script src="./three-painterly-preview.js"></script>
</body>
</html>
